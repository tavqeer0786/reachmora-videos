name: Render Walmart Chapter 1 Custom Story Video

on:
  workflow_dispatch:
    inputs:
      voiceover:
        description: "Voiceover path"
        required: true
        default: "projects/walmart-cl1-custom/voiceover.mp3"
      script:
        description: "Script reference path"
        required: true
        default: "projects/walmart-cl1-custom/script.md"
      chapter_title:
        description: "Chapter tag"
        required: true
        default: "CHAPTER 1 | THE PROBLEM WITH ONE BIG BLACK FRIDAY"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python renderer dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Download style fonts
        working-directory: projects/walmart-cl1-custom
        run: |
          mkdir -p fonts
          curl -L --fail -o fonts/ComicRelief-Bold.ttf https://github.com/google/fonts/raw/main/ofl/comicrelief/ComicRelief-Bold.ttf
          curl -L --fail -o fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
      - name: Render contact sheet
        working-directory: projects/walmart-cl1-custom
        run: python preview.py out/contact-sheet.jpg 0 7.3 11 14 16.5 26 29 35.5 38.5 43 46 53.5 59 65 68.5 70 77.5 82.5 87.5
      - name: Render segmented MP4 on GitHub CPU
        working-directory: projects/walmart-cl1-custom
        run: python render_all.py "../../${{ inputs.voiceover }}" out/chapter-1.mp4
      - name: Verify output
        working-directory: projects/walmart-cl1-custom
        run: ffprobe -v error -show_entries stream=width,height,codec_name,r_frame_rate -show_entries format=duration -of json out/chapter-1.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: walmart-chapter-1-custom-video
          path: |
            projects/walmart-cl1-custom/out/chapter-1.mp4
            projects/walmart-cl1-custom/out/contact-sheet.jpg
