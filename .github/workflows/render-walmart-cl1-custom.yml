name: Render Walmart Chapter 1 Custom Story Video

on:
  workflow_dispatch:
    inputs:
      voiceover:
        description: "Voiceover path"
        required: true
        default: "projects/walmart-cl1-custom/voiceover.mp3"
      script:
        description: "Script reference path"
        required: true
        default: "projects/walmart-cl1-custom/script.md"
      chapter_title:
        description: "Chapter tag"
        required: true
        default: "CHAPTER 1 | THE PROBLEM WITH ONE BIG BLACK FRIDAY"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python renderer dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Download style fonts
        working-directory: projects/walmart-cl1-custom
        run: |
          mkdir -p fonts
          curl -L --fail -o fonts/ComicRelief-Bold.ttf https://github.com/google/fonts/raw/main/ofl/comicrelief/ComicRelief-Bold.ttf
          curl -L --fail -o fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
      - name: Join all voiceover chapters
        working-directory: projects/walmart-cl1-custom
        run: |
          printf "file 'hook.mp3'\nfile 'ch-1.mp3'\nfile 'ch-2.mp3'\nfile 'ch-3.mp3'\nfile 'ch-4.mp3'\nfile 'ch-5.mp3'\nfile 'ch-6.mp3'\nfile 'ch-7.mp3'\nfile 'ch-8.mp3'\nfile 'final-chapter.mp3'\n" > voice-list.txt
          ffmpeg -y -v error -f concat -safe 0 -i voice-list.txt -c:a libmp3lame -q:a 2 voice-all.mp3
      - name: Render contact sheet
        working-directory: projects/walmart-cl1-custom
        run: |
          mkdir -p out
          python preview.py out/contact-sheet.jpg 0 60 80 150 200 260 340 420 500 600 700 800 890
      - name: Render segmented MP4 on GitHub CPU
        working-directory: projects/walmart-cl1-custom
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u render_all.py voice-all.mp3 out/walmart-black-friday-part-2.mp4
      - name: Verify output
        working-directory: projects/walmart-cl1-custom
        run: ffprobe -v error -show_entries stream=width,height,codec_name,r_frame_rate -show_entries format=duration -of json out/walmart-black-friday-part-2.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: walmart-chapter-1-custom-video
          path: |
            projects/walmart-cl1-custom/out/walmart-black-friday-part-2.mp4
            projects/walmart-cl1-custom/out/contact-sheet.jpg
