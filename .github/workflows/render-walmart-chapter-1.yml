name: Render Walmart Chapter 1 B5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skills/directing-stickman-videos/package-lock.json
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install renderer dependencies
        working-directory: skills/directing-stickman-videos
        run: npm ci
      - name: Render Chapter 1 on GitHub CPU
        working-directory: projects/walmart-chapter-1
        run: node render.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: walmart-black-friday-chapter-1
          path: projects/walmart-chapter-1/walmart-black-friday-ch1.mp4
          if-no-files-found: error
          retention-days: 7
